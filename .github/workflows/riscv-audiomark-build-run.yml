name: RISC-V AudioMark CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/riscv-audiomark-build-run.yml"
      - "ports/riscv/**"
      - "lib/speexdsp/**"
      - "src/**"
      - "tests/**"
      - "main.c"
      - "CMakeLists.txt"
  push:
    paths:
      - ".github/workflows/riscv-audiomark-build-run.yml"
      - "ports/riscv/**"
      - "lib/speexdsp/**"
      - "src/**"
      - "tests/**"
      - "main.c"
      - "CMakeLists.txt"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test-benchmark:
    name: RISC-V (${{ matrix.march_display }}) AudioMark build and QEMU / CLANG@19.1.1
    runs-on: ubuntu-latest
    env:
      VERSION_QEMU: "9.2.4"
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: scalar
            march: rv64gc
            march_display: RV64GC
            port_dir: ports/riscv
            qemu_cpu: rv64,g=true,c=true
          - key: vector
            march: rv64gcv
            march_display: RV64GCV
            port_dir: ports/riscv/v
            qemu_cpu: rv64,v=true,vext_spec=v1.0,vlen=128
          - key: zve32x
            march: rv64gc_zve32x
            march_display: RV64GC_Zve32x
            port_dir: ports/riscv/v
            qemu_cpu: rv64,g=true,c=true,zve32x=true,vlen=128
          - key: zve32f
            march: rv64gc_zve32f
            march_display: RV64GC_Zve32f
            port_dir: ports/riscv/v
            qemu_cpu: rv64,g=true,c=true,zve32f=true,vlen=128
          - key: zve64x
            march: rv64gc_zve64x
            march_display: RV64GC_Zve64x
            port_dir: ports/riscv/v
            qemu_cpu: rv64,g=true,c=true,zve64x=true,vlen=128
          - key: zve64f
            march: rv64gc_zve64f
            march_display: RV64GC_Zve64f
            port_dir: ports/riscv/v
            qemu_cpu: rv64,g=true,c=true,zve64f=true,vlen=128

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache QEMU build
        id: cache-qemu
        uses: actions/cache@v5
        with:
          path: ~/qemu-install
          key: qemu-${{ env.VERSION_QEMU }}-riscv64-linux

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          if [ "${{ steps.cache-qemu.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get install -y \
              clang-19 lld-19 \
              gcc-riscv64-linux-gnu \
              libc6-dev-riscv64-cross \
              libglib2.0-dev libpixman-1-dev \
              ninja-build python3-venv
          else
            sudo apt-get install -y \
              clang-19 lld-19 \
              gcc-riscv64-linux-gnu \
              libc6-dev-riscv64-cross
          fi

      - name: Build QEMU user-mode (riscv64) from source
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        run: |
          wget -q https://download.qemu.org/qemu-${{ env.VERSION_QEMU }}.tar.xz
          tar xf qemu-${{ env.VERSION_QEMU }}.tar.xz
          cd qemu-${{ env.VERSION_QEMU }}
          ./configure \
            --prefix=$HOME/qemu-install \
            --target-list=riscv64-linux-user \
            --disable-system \
            --enable-linux-user \
            --disable-docs \
            --disable-werror
          make -j$(nproc)
          make install

      - name: Set up environment
        run: |
          echo "$HOME/qemu-install/bin" >> $GITHUB_PATH
          echo "RUN=qemu-riscv64 -L /usr/riscv64-linux-gnu -cpu ${{ matrix.qemu_cpu }}" >> $GITHUB_ENV

      - name: Print compiler info
        run: clang-19 -v 2>&1

      - name: Configure CMake
        run: |
          SYSROOT=$(riscv64-linux-gnu-gcc -print-sysroot)
          cmake -S . -B build-${{ matrix.key }} \
            -DPORT_DIR=${{ matrix.port_dir }} \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_C_FLAGS="--target=riscv64-linux-gnu -march=${{ matrix.march }} -O2 --sysroot=${SYSROOT}" \
            -DCMAKE_EXE_LINKER_FLAGS="--target=riscv64-linux-gnu --sysroot=${SYSROOT} -fuse-ld=/usr/bin/riscv64-linux-gnu-ld"

      - name: Build
        run: cmake --build build-${{ matrix.key }} --parallel

      - name: Run unit tests
        run: |
          $RUN ./build-${{ matrix.key }}/test_abf_f32
          $RUN ./build-${{ matrix.key }}/test_aec_f32
          $RUN ./build-${{ matrix.key }}/test_anr_f32
          $RUN ./build-${{ matrix.key }}/test_kws
          $RUN ./build-${{ matrix.key }}/test_mfcc_f32

      - name: Run AudioMark benchmark
        timeout-minutes: 15
        run: $RUN ./build-${{ matrix.key }}/audiomark 2>&1 | tee audiomark_${{ matrix.key }}_output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audiomark-${{ matrix.key }}-results
          path: audiomark_${{ matrix.key }}_output.txt
          retention-days: 30
